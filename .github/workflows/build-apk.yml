name: Simply PPT Android Release Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/protocol/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Verify TypeScript & Jest Tests
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npm test

      - name: Build Android Release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'SimplyPPTRelease2026' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'simplyppt-release' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'SimplyPPTRelease2026' }}
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            echo "Release keystore decoded from GitHub Actions Secret."
          else
            echo "Generating dedicated release keystore for CI release artifact..."
            keytool -genkeypair -v \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=Simply PPT Release, O=Simply PPT, C=ID"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Verify Generated APK
        run: |
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK successfully built at $APK_PATH"
            sha256sum "$APK_PATH"
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            echo "Using apksigner at $APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          else
            echo "Error: APK not found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simply-ppt-android-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
